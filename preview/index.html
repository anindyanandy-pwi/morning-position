<body>
<header class="top">
  <div class="brand"><span class="brand-ir">Eastern Railway</span><span class="brand-sub">Howrah Division · Morning Position</span></div>
  <nav class="menu" id="menu"></nav>
  <div class="top-right"><span class="who" id="whoami"></span><button class="btn-line sm" id="signout" data-press="1" hidden>Sign out</button></div>
</header>

<main id="login" class="login" hidden>
  <div class="login-card">
    <div class="login-h">Morning Position</div>
    <div id="stepEmail">
      <label class="lbl" for="loginEmail">Your railway email</label>
      <input id="loginEmail" class="field" type="email" autocomplete="email" placeholder="name@gmail.com">
      <button id="sendCode" class="btn" data-press="1">Send code</button>
    </div>
    <div id="stepCode" hidden>
      <label class="lbl" for="loginCode">Enter the 6-digit code</label>
      <input id="loginCode" class="field mono" inputmode="numeric" maxlength="6" placeholder="••••••">
      <button id="verify" class="btn" data-press="1">Sign in</button>
    </div>
    <div id="msgLogin" class="msg"></div>
    <div class="login-foot small">Opens on your phone or PC · <code>…/morning-position/aen</code></div>
  </div>
</main>

<main id="app" class="app" hidden>
  <div id="screen" class="screen"></div>
</main>
